[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics-kb-rag"
version = "1.0.0"
description = "物流企业知识库智能问答服务：零依赖可复现的混合检索 RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yu Xiaodong" }]
keywords = ["rag", "logistics", "knowledge-base", "bm25", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# 核心运行时零第三方依赖，这是项目刻意保留的离线可复现边界。
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
]
docs = [
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "pypdf>=4.0,<6.0",
]
full = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "pypdf>=4.0,<6.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
logistics-kb = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI 的 Depends(...) 默认参数是官方用法
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
